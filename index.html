<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Search Console ownership verification. Must stay in place —
         removing it un-verifies the property. Lives here rather than in
         SEO.jsx so it's present on every prerendered page's <head>. -->
    <meta name="google-site-verification" content="xvednFTPNqq2FUr8ETWf1ByrroUcjEIMLPBziumggrM" />

    <!-- Title/description are rendered per-page by each route via
         src/components/SEO.jsx (React 19 hoists <title>/<meta> to <head>),
         then baked into static HTML by scripts/prerender.js. No default here
         to avoid a duplicate tag once a page's own SEO component mounts. -->

    <!-- Google Analytics is deliberately NOT loaded here. It is injected by
         src/components/CookieConsent.jsx only after the visitor accepts, so no
         non-essential cookie is set before consent — see the Cookies section of
         /privacy. Re-adding a gtag snippet here would silently reintroduce
         pre-consent tracking. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
