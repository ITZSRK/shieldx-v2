<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Search Console ownership verification. Must stay in place —
         removing it un-verifies the property. Lives here rather than in
         SEO.jsx so it's present on every prerendered page's <head>. -->
    <meta name="google-site-verification" content="xvednFTPNqq2FUr8ETWf1ByrroUcjEIMLPBziumggrM" />

    <!-- Title/description are rendered per-page by each route via
         src/components/SEO.jsx (React 19 hoists <title>/<meta> to <head>),
         then baked into static HTML by scripts/prerender.js. No default here
         to avoid a duplicate tag once a page's own SEO component mounts. -->

    <!-- Google tag (gtag.js) — replace GT-NBPN8RJL with your Measurement ID -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=GT-NBPN8RJL"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'GT-NBPN8RJL');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
