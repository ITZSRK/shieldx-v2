name: Secret scan

# Catches hardcoded credentials, API keys and tokens before they reach a branch
# or a bank's on-prem review. Runs the official gitleaks binary directly (MIT,
# pinned by version) — no third-party Action wrapper, no license key. Runs on a
# GitHub-hosted runner, deliberately NOT the self-hosted runner, so secret
# scanning never depends on our own box being up.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan every commit, not just the tip

      - name: Run gitleaks
        run: |
          set -euo pipefail
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gl.tgz
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks version
          # --redacted: never print the secret value itself into CI logs.
          # Exit non-zero on any finding so the check fails the build.
          /tmp/gitleaks detect --source . --redact=100 --verbose --exit-code 1
