name: Deploy to Azure Static Web Apps

# REPLACES deploy.yml, which pushed to s3://shieldx-v2-site and invalidated
# CloudFront distribution E34D7ZVUKOQQ1X. That distribution is the one behind
# d3cxijki88bjo6.cloudfront.net, which no longer resolves — it is why
# queloshieldx.in has been serving nothing. The AWS account is gone, so that
# workflow cannot succeed and is removed rather than left to fail quietly.
#
# Not the application box either: shieldx-landing runs the backend, the engine,
# the file processor and Postgres behind one nginx, and its single default
# server block means it answers for ANY hostname. Pointing the apex there would
# serve the product's login page on the marketing domain.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build

      # The build runs vite AND scripts/prerender.js, which writes 21 route
      # directories. If prerendering silently stops producing them the site
      # still "builds" and every deep link quietly becomes a client-side
      # render, which is worse for search than it looks.
      - name: Assert the build produced what it should
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/staticwebapp.config.json || { echo "::error::staticwebapp.config.json missing from dist — it lives in public/"; exit 1; }
          n=$(find dist -name index.html | wc -l | tr -d ' ')
          echo "prerendered pages: $n"
          [ "$n" -ge 10 ] || { echo "::error::only $n html pages — prerendering did not run"; exit 1; }

      # app_location IS what gets published when skip_app_build is true;
      # output_location is only read when the action builds for you. Pointing
      # it at "/" publishes the repository root, and the action still exits 0 —
      # the site then serves Azure's placeholder and nothing says otherwise.
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "dist"
          skip_app_build: true

  close-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
